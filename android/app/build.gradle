plugins { id 'com.android.application' }

def configValue = { key -> (project.findProperty(key) ?: 'REPLACE').toString() }
android {
    namespace 'com.interntrack'
    compileSdk 35
    defaultConfig {
        applicationId 'com.interntrack'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appAuthRedirectScheme: 'interntrack']
        resValue 'string', 'app_name', 'InternTrack'
        buildConfigField 'boolean', 'DEMO_MODE', 'false'
        buildConfigField 'String', 'API_URL', '"' + configValue('trackerApiUrl') + '"'
        buildConfigField 'String', 'COGNITO_DOMAIN', '"' + configValue('trackerCognitoDomain') + '"'
        buildConfigField 'String', 'COGNITO_CLIENT_ID', '"' + configValue('trackerCognitoClientId') + '"'
        buildConfigField 'String', 'ASSET_BASE_URL', '"' + configValue('trackerAssetBaseUrl') + '"'
    }
    buildTypes {
        demo {
            initWith debug
            applicationIdSuffix '.demo'
            versionNameSuffix '-demo'
            resValue 'string', 'app_name', 'InternTrack Demo'
            buildConfigField 'boolean', 'DEMO_MODE', 'true'
            matchingFallbacks = ['debug']
        }
    }
    sourceSets { main.assets.srcDir '../../assets' }
    buildFeatures { buildConfig true }
    testBuildType project.findProperty('trackerTestBuildType') ?: 'debug'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'net.openid:appauth:0.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
}
